# Buduje instalator GibCorda dla Windows.
#  • tag vX.Y.Z (np. v1.0.1) → testy, instalator i wydanie na GitHubie (z latest.yml dla automatycznych aktualizacji)
#  • ręcznie (Actions → Wydanie → Run workflow) → tylko instalator do pobrania jako artefakt, bez wydania
#  • w obu przypadkach także pakiet do Microsoft Store (GibCord-Store-X.Y.Z.appx) — Sklep sam go podpisuje;
#    przy wydaniu dochodzi on do plików wydania, skąd wgrywa się go w Partner Center
name: Wydanie

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wydanie-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # bez podpisu cyfrowego
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Testy
        run: npm test

      - name: Sprawdzenie konfiguracji
        shell: bash
        run: |
          if grep -q '"owner": "OWNER"' package.json; then
            echo "::error::W package.json (build.publish.owner) wpisz nazwę konta GitHub zamiast OWNER"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"; p=$(node -p "require('./package.json').version")
            if [ "$v" != "$p" ]; then echo "::error::Tag $GITHUB_REF_NAME nie zgadza się z wersją w package.json ($p)"; exit 1; fi
          fi

      - name: Instalator i wydanie (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalator bez wydania (ręcznie)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --x64 --publish never

      - name: Pakiet do Microsoft Store (MSIX)
        shell: bash
        run: |
          npx electron-builder --win appx --x64 --publish never
          ls -la dist/*.appx
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then gh release upload "$GITHUB_REF_NAME" dist/*.appx --clobber; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: GibCord-Setup
          path: |
            dist/*.exe
            dist/*.appx
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
